services:
  - type: web
    name: worldcup-predictor
    runtime: node
    region: ohio
    plan: free
    buildCommand: npm ci && pip install -r requirements.txt
    startCommand: node server/index.js
    healthCheckPath: /
    envVars:
      - key: FOOTBALL_API_KEY
        sync: false
      - key: ODDS_API_KEY
        sync: false
      - key: PORT
        value: 3000
      - key: NODE_ENV
        value: production
      - key: AI_API_KEY
        sync: false
      - key: AI_MODEL
        value: deepseek-v4-flash
      - key: AI_API_BASE
        value: https://api.deepseek.com
      - key: AI_MAX_TOKENS
        value: "4096"
      - key: AI_TEMPERATURE
        value: "0.3"
      - key: AI_CACHE_TTL
        value: "3600"
      - key: AI_TIMEOUT
        value: "30000"
